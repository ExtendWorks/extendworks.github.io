<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Replacer — We're sorry to see you go</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="../welcome/img/favicon-32.png">
  <link rel="stylesheet" href="../welcome/style.css">
  <style>
    .mode { display: block; }
    .center { text-align: center; }
    .form-wrap { margin-top: 28px; }
    .form-wrap iframe { display: block; width: 100%; height: 820px; border: 0; border-radius: 12px; }
    .fallback { margin-top: 16px; font-size: 15px; color: var(--muted); text-align: center; }
    .fallback a { color: var(--blue); font-weight: 600; }
  </style>
</head>
<body>
  <main class="page" style="max-width:680px">
    <header class="brand">
      <img src="../welcome/img/logo.svg" width="40" height="40" alt="">
      <span>Text Replacer</span>
    </header>

    <section class="mode" aria-labelledby="bye-title">
      <h1 id="bye-title" class="center">We're sorry to see you go</h1>
      <p class="lead center">Tell us what went wrong. It takes 30 seconds and helps us fix it.</p>

      <div class="form-wrap">
        <iframe id="form" src="https://docs.google.com/forms/d/e/1FAIpQLSdMnGOQ4XMeZgHzXnmK8a_OcYeuen-m_5wZ3N6EGqKhI9GPtw/viewform?embedded=true" loading="lazy" title="Feedback form">Loading form…</iframe>
      </div>
      <p class="fallback">Form not loading? <a id="form-link" href="https://docs.google.com/forms/d/e/1FAIpQLSdMnGOQ4XMeZgHzXnmK8a_OcYeuen-m_5wZ3N6EGqKhI9GPtw/viewform" target="_blank" rel="noopener">Open it in a new tab</a></p>
    </section>
  </main>
</body>
</html>
