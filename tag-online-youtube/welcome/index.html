<title>You're all set — Tag Online Youtube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #C0392B;
    --accent-dark: #a3301f;
    --ink: #0f0f0f;
    --muted: #5f6368;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: var(--ink);
    font-family: 'Roboto', Arial, Helvetica, sans-serif;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 88px 24px 0;
    text-align: center;
  }
  h1 {
    font-size: 38px;
    font-weight: 700;
    line-height: 1.25;
    margin: 0 0 18px;
  }
  p.instruction {
    font-size: 19px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1.5;
    max-width: 520px;
    margin: 0 auto 35px;
  }
  a.cta {
    display: inline-block;
    background: var(--accent);
    color: #ffffff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    padding: 15px 36px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(192, 57, 43, 0.38);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  a.cta:hover {
    background: var(--accent-dark);
    box-shadow: 0 12px 28px rgba(192, 57, 43, 0.46);
  }

  .annotated {
    display: flex;
    justify-content: center;
    margin: 42px auto 120px;
    padding-bottom: 40px;
  }
  .shot-inner {
    position: relative;
    width: 608px;
    flex: 0 0 auto;
  }
  .card {
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 18px 45px rgba(0,0,0,0.16);
  }
  .card img { display: block; width: 100%; height: auto; }

  .label {
    position: absolute;
    font-size: 37px;
    font-weight: 800;
    color: var(--accent);
    white-space: nowrap;
    line-height: 1;
  }
  .tags-label { left: -147px; top: 412px; }
  .copy-label { left: 499px; top: 534px; }

  .arrow { position: absolute; overflow: visible; }
  .arrow-tags { left: -114px; top: 434px; width: 118px; height: 66px; }
  .arrow-copy { left: 431px; top: 484px; width: 142px; height: 55px; }

  @media (max-width: 1000px) {
    .label, .arrow { display: none; }
    .annotated { margin-bottom: 60px; padding-bottom: 0; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 56px 18px 0; }
    h1 { font-size: 28px; }
    p.instruction { font-size: 17px; }
  }
</style>
</head>
